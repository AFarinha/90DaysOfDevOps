{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "bankapp.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    - name: web
      port: {{ ternary 443 80 .Values.gateway.tls.enabled }}
      protocol: {{ ternary "HTTPS" "HTTP" .Values.gateway.tls.enabled }}
      hostname: {{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}
      {{- if .Values.gateway.tls.enabled }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ required "gateway.tls.certificateRef is required" .Values.gateway.tls.certificateRef }}
      {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bankapp.fullname" . }}-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ include "bankapp.fullname" . }}-gateway
  hostnames: [{{ .Values.gateway.hostname | quote }}]
  rules:
    - backendRefs:
        - name: {{ include "bankapp.fullname" . }}-service
          port: {{ .Values.bankapp.service.port }}
{{- end }}
