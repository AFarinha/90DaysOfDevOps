# Local read-only validation aliases; these are one WSL host, not three servers.
[web]
web-server ansible_connection=local
[app]
app-server ansible_connection=local
[db]
db-server ansible_connection=local
[application:children]
web
app
[all_servers:children]
application
db
[all:vars]
ansible_python_interpreter=/usr/bin/python3
