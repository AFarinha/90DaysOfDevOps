---
- name: Server health report
  hosts: all
  tasks:
    - name: Read root filesystem usage
      ansible.builtin.command: df -P /
      register: disk_result
      changed_when: false
    - name: Read memory
      ansible.builtin.command: free -m
      register: memory_result
      changed_when: false
    - name: Read running services
      ansible.builtin.command: systemctl list-units --type=service --state=running --no-legend --no-pager
      register: services_result
      changed_when: false
      when: ansible_facts.service_mgr == 'systemd'
    - name: Calculate disk usage
      ansible.builtin.set_fact:
        disk_used_percent: "{{ disk_result.stdout_lines[1].split()[4] | replace('%', '') | int }}"
    - name: Print health report
      ansible.builtin.debug:
        msg:
          - "Server: {{ inventory_hostname }}"
          - "OS: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          - "RAM: {{ ansible_facts.memtotal_mb }}MB"
          - "Disk: {{ disk_used_percent }}%"
          - "Memory: {{ memory_result.stdout }}"
          - "Running services (first 20): {{ (services_result.stdout_lines | default([]))[:20] | length }}"
    - name: Flag critically low disk space
      ansible.builtin.debug:
        msg: "ALERT: root filesystem is at least 90% full"
      when: disk_used_percent | int >= 90
    - name: Save report on each managed node
      ansible.builtin.copy:
        content: |
          Server: {{ inventory_hostname }}
          OS: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
          IP: {{ ansible_facts.get('default_ipv4', {}).get('address', 'unavailable') }}
          RAM: {{ ansible_facts.memtotal_mb }}MB
          Disk: {{ disk_result.stdout }}
          Memory: {{ memory_result.stdout }}
          Checked at: {{ ansible_facts.date_time.iso8601 }}
        dest: "{{ report_dir }}/server-report-{{ inventory_hostname }}.txt"
        mode: '0644'
