apiVersion: v1
kind: Pod
metadata:
  name: liveness
  labels:
    app: liveness
spec:
  containers:
  - name: liveness
    image: busybox:1.36
    command:
    - sh
    - -c
    - touch /tmp/healthy; sleep 30; rm /tmp/healthy; sleep 3600
    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/healthy
      periodSeconds: 5
      failureThreshold: 3
  terminationGracePeriodSeconds: 1
