apiVersion: v1
kind: Pod
metadata:
  name: startup
  labels:
    app: startup
spec:
  containers:
  - name: startup
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 20; touch /tmp/started; sleep 3600
    startupProbe:
      exec:
        command:
        - test
        - -f
        - /tmp/started
      periodSeconds: 5
      failureThreshold: 12
    livenessProbe:
      exec:
        command:
        - test
        - -f
        - /tmp/started
      periodSeconds: 5
