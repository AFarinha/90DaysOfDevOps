- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
- name: Remove Ubuntu default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx
- name: Deploy main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
    validate: nginx -t -c %s
  notify: Reload Nginx
- name: Deploy reverse proxy
  ansible.builtin.template:
    src: app-proxy.conf.j2
    dest: /etc/nginx/conf.d/devops-app.conf
    mode: '0644'
  notify: Reload Nginx
- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
- name: Start and enable Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  when: not (lab_mode | bool)
