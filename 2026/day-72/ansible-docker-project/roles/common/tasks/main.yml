- name: Refresh Ubuntu package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
- name: Install common packages
  ansible.builtin.apt:
    name: '{{ common_packages }}'
    state: present
- name: Set hostname
  ansible.builtin.hostname:
    name: '{{ inventory_hostname }}'
  when: not (lab_mode | bool)
- name: Set timezone
  community.general.timezone:
    name: '{{ timezone }}'
  when: not (lab_mode | bool)
- name: Create deploy user
  ansible.builtin.user:
    name: deploy
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
