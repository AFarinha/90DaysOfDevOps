- name: Configure web servers
  hosts: web
  become: true
  roles:
  - role: webserver
    vars:
      app_name: terraweek
      http_port: 80
- name: Configure app servers
  hosts: app
  become: true
  roles:
  - geerlingguy.docker
- name: Render database configuration
  hosts: db
  become: true
  tasks:
  - name: Write protected database configuration
    ansible.builtin.template:
      src: templates/db-config.j2
      dest: /etc/db-config.env
      owner: root
      mode: '0600'
    no_log: true
    diff: false
