apiVersion: v1
kind: Pod
metadata:
  name: secret-consumer
  labels:
    app: secret-consumer
spec:
  containers:
  - name: secret-consumer
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: credentials
      mountPath: /etc/db-credentials
      readOnly: true
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: DB_USER
  volumes:
  - name: credentials
    secret:
      secretName: db-credentials
