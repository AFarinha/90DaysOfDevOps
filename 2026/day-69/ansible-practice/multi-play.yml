---
- name: Configure web servers
  hosts: web
  become: true
  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
- name: Configure application servers
  hosts: app
  become: true
  tasks:
    - name: Install build tools
      ansible.builtin.apt:
        name: [gcc, make]
        state: present
        update_cache: true
    - name: Create app directory
      ansible.builtin.file:
        path: /opt/app
        state: directory
        mode: '0755'
- name: Configure database servers
  hosts: db
  become: true
  tasks:
    - name: Install MySQL client
      ansible.builtin.apt:
        name: mysql-client
        state: present
        update_cache: true
    - name: Create data directory
      ansible.builtin.file:
        path: /var/lib/appdata
        state: directory
        mode: '0700'
