name: day76-observability
services:
  prometheus:
    image: prom/prometheus:latest
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - prometheus_data:/prometheus
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    networks:
    - monitoring
    restart: unless-stopped
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.retention.time=30d
    - --storage.tsdb.retention.size=1GB
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  notes-app:
    image: day76-notes-app:lab
    ports:
    - 127.0.0.1:8000:8000
    networks:
    - monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    build:
      context: ../.reference/notes-app
    volumes:
    - ./app:/lab:ro
    command:
    - python
    - /lab/start-app.py
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    command:
    - --path.procfs=/host/proc
    - --path.rootfs=/rootfs
    - --path.sysfs=/host/sys
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    expose:
    - 9100
    networks:
    - monitoring
    ports:
    - 127.0.0.1:9100:9100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    ports:
    - 127.0.0.1:18082:8080
    volumes:
    - /:/rootfs:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /run/containerd:/run/containerd:ro
    networks:
    - monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  grafana:
    image: grafana/grafana-enterprise
    ports:
    - 127.0.0.1:3000:3000
    volumes:
    - grafana_data:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
    - monitoring
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD
        in .env}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  loki:
    image: grafana/loki:latest
    ports:
    - 127.0.0.1:3100:3100
    volumes:
    - ./loki/loki-config.yml:/etc/loki/config.yaml:ro
    - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
    - monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  promtail:
    image: grafana/promtail:latest
    volumes:
    - ./promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - promtail_positions:/positions
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
    - loki
    networks:
    - monitoring
    restart: unless-stopped
    ports:
    - 127.0.0.1:9080:9080
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command:
    - --config=/etc/otelcol-contrib/config.yaml
    volumes:
    - ./otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
    - 127.0.0.1:4317:4317
    - 127.0.0.1:4318:4318
    - 127.0.0.1:8889:8889
    expose:
    - 8889
    networks:
    - monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  promtail_positions: {}
networks:
  monitoring:
    driver: bridge
