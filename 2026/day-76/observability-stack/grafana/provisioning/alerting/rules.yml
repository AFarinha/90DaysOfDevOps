apiVersion: 1
groups:
- orgId: 1
  name: container-memory
  folder: DevOps Lab
  interval: 1m
  rules:
  - uid: container-memory
    title: High Container Memory
    condition: C
    for: 2m
    noDataState: NoData
    execErrState: Error
    labels:
      severity: warning
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max(container_memory_usage_bytes{container_label_com_docker_compose_service="notes-app"})/1024/1024
        instant: true
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 100
          operator:
            type: and
