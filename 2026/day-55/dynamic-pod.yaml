apiVersion: v1
kind: Pod
metadata:
  name: dynamic
  labels:
    app: dynamic
spec:
  containers:
  - name: dynamic
    image: busybox:1.36
    command:
    - sh
    - -c
    - echo "Dynamic storage works" > /data/message.txt; sleep 3600
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: dynamic-data
