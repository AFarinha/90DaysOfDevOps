apiVersion: v1
kind: Pod
metadata:
  name: persistent
  labels:
    app: persistent
spec:
  containers:
  - name: persistent
    image: busybox:1.36
    command:
    - sh
    - -c
    - date -u >> /data/message.txt; sleep 3600
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: static-data
