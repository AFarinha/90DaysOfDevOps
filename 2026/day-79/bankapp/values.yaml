bankapp:
  replicaCount: 4
  image:
    repository: trainwithshubham/ai-bankapp-eks
    tag: 1c7cb0e
    pullPolicy: Always
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  service:
    type: ClusterIP
    port: 8080
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70
mysql:
  enabled: true
  image:
    repository: mysql
    tag: '8.0'
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    size: 5Gi
    storageClass: standard
ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: latest
  model: tinyllama
  resources:
    requests:
      memory: 2Gi
      cpu: 900m
    limits:
      memory: 2.5Gi
      cpu: 1500m
  persistence:
    size: 10Gi
    storageClass: standard
config:
  mysqlDatabase: bankappdb
  ollamaUrl: ''
  externalMysqlHost: ''
secrets:
  existingSecret: bankapp-credentials
  mysqlRootPassword: ''
  mysqlUser: root
  mysqlPassword: ''
storageClass:
  create: false
  name: gp3
  provisioner: ebs.csi.aws.com
gateway:
  enabled: false
  hostname: ''
  tls:
    enabled: false
    certificateRef: ''
  gatewayClassName: envoy
